###############################################################################
# Cluster leaf: ci/redis — atlas-compute-provision overlay
# -----------------------------------------------------------------------------
# Purpose : Proxmox VM / DNS / TF state knobs for this leaf
# Defaults: sibling playbooks/group_vars/all/provision_defaults.yml
# Docs    : docs/stacks/compute-provision.md
#
# Prefer atlas-compute-provision.secrets.yml (or Vault) for tokens/passwords.
###############################################################################

# =============================================================================
# Stack
# =============================================================================
# TF layout under stacks/<name>/ — redis leaf (masters/replicas/proxies/lbs).

# Leaf DNS identity
# (duplicated into every atlas-*.yml that uses leaf DNS / workspace id)
dns_domain_suffix: example.com
cluster_domain: "redis.{{ dns_domain_suffix }}" # Cluster FQDN, usually a name under the DNS suffix

provision_stack: redis
# Lifecycle: apply | recreate | destroy
provision_mode: recreate

# =============================================================================
# Inventory → Terraform maps
# =============================================================================
provision_hosts_file: "{{ cluster_inventory | default(cluster_config_dir ~ '/hosts', true) }}"
provision_inventory_group_map_redis:
  redis_cluster_masters: redis_cluster_master_node
  redis_cluster_replicas: redis_cluster_replica_node
  redis_proxies: redis_proxy_node
  redis_lbs: redis_lbs_node
provision_tf_module_map_redis:
  redis_cluster_master_node: proxmox_redis_cluster_master
  redis_cluster_replica_node: proxmox_redis_cluster_replica
  redis_proxy_node: proxmox_redis_proxy
  redis_lbs_node: proxmox_redis_lbs

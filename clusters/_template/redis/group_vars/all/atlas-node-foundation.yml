###############################################################################
# Cluster leaf: dev/redis — atlas-node-foundation overlay
# -----------------------------------------------------------------------------
# Purpose : OS bootstrap for redis_* (init)
# Defaults: sibling atlas-node-foundation group_vars/all/atlas-node-foundation.yml (+ roles/*/defaults)
# Docs    : docs/stacks/redis.md
#           Must cover the same inventory groups as atlas-redis limits.
#
# Prefer atlas-node-foundation.secrets.yml (or Vault) for passwords.
###############################################################################

# =============================================================================
# Targeting
# =============================================================================

# Leaf DNS identity
# (duplicated into every atlas-*.yml that uses leaf DNS / workspace id)
dns_domain_suffix: example.com
cluster_domain: "redis.{{ dns_domain_suffix }}" # Cluster FQDN, usually a name under the DNS suffix

node_foundation_init_hosts: "redis_cluster_masters:redis_cluster_replicas:redis_proxies:redis_lbs"

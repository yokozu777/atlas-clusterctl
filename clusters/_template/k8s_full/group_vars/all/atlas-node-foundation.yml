###############################################################################
# Cluster leaf: dev/k8s — atlas-node-foundation overlay
# -----------------------------------------------------------------------------
# Purpose : OS bootstrap for k8s_* (init)
# Defaults: sibling atlas-node-foundation group_vars/all/atlas-node-foundation.yml (+ roles/*/defaults)
# Docs    : docs/stacks/k8s-core.md
#           Infra OS bootstrap lives on dev/infra (docs/stacks/infra-edge.md).
#           Must cover the same inventory groups as atlas-k8s-core limits.
#
# Prefer atlas-node-foundation.secrets.yml (or Vault) for passwords.
###############################################################################

# =============================================================================
# Targeting
# =============================================================================

# Leaf DNS identity
# (duplicated into every atlas-*.yml that uses leaf DNS / workspace id)
admin_user: localuser

# Connection user (set here so connection uses it from the start)
ansible_user: "{{ admin_user }}"

# SSH port for initial connection
# Default: 22
initial_ssh_port: 22

# Initial connection method: 'password' or 'key'
# Default: password
init_ssh_connect: key
# Key for SSH: leave empty to use SSH_KEY/ANSIBLE_PRIVATE_KEY_FILE (run.sh); or set e.g. pub_keys/id_rsa for repo key
initial_key_file: ""
initial_user: "{{ admin_user }}" # Initial user for the system.
# initial_password → atlas-node-foundation.secrets.yml (prefer init_ssh_connect: key)

# ============================================
# Variables for role 01_backup_etc
# ============================================

# Create backup of /etc before configuration
# Default: false (backup not created)
backup_etc: false

# ============================================
# Variables for role 02_init_sshd
# ============================================

# Disable root login over SSH
# Default: false (root login allowed)
disable_root_login: false

# Disable password authentication
# Default: false (password auth allowed)
disable_password_auth: false

# Change default SSH port (22)
# Default: false (port unchanged)
change_default_ssh_port: false

# New SSH port (used only if change_default_ssh_port: true)
# Example: 2222
new_ssh_port: 2222

# ============================================
# Variables for role 03_configure_users
# ============================================

# System user name (required variable)
# Default in role: localuser
system_user: "{{ admin_user }}"

# Change root password
# Default: false (root password unchanged)
change_root_password: false

# New root password (used only if change_root_password: true)
# → atlas-node-foundation.secrets.yml
# Enable setting password for system_user
# Default: false (password not set)
enable_system_user_password: false

# Password for system_user (used only if enable_system_user_password: true)
# → atlas-node-foundation.secrets.yml

# Path to folder with public SSH keys to add to the user
# Default: undefined (no keys added)
# Example: "/path/to/keys" or "{{ playbook_dir }}/files/ssh_keys"
pub_keys_folder: "{{ cluster_pub_keys_dir }}" # Folder containing public SSH keys.

# ============================================
# Variables for role 04_configure_hostname
# ============================================

# Prefer per-host override in host_vars/<inventory_hostname>.yml
# Empty = skip hostname module (role when: hostname is defined and length > 0)
# hostname: ""

# ============================================
# Variables for role 19_configure_sysctl_limits
# ============================================

# Copy system files (sysctl.conf)
# Default: false (files not copied)
copy_system_files: true

# Configure system limits (file descriptors, threads)
# Default: false (limits not configured)
configure_system_limits: true

# Kernel modules to load before applying sysctl (bridge/conntrack for k8s)
sysctl_kernel_modules:
  - br_netfilter
  - nf_conntrack

# Critical sysctl keys verified after apply (key/value pairs)
sysctl_verify_critical:
  - { key: vm.swappiness, value: '1' }
  - { key: vm.max_map_count, value: '2097152' }
  - { key: fs.file-max, value: '2097152' }
  - { key: net.ipv4.ip_forward, value: '1' }
  - { key: net.ipv6.conf.all.disable_ipv6, value: '1' }
  - { key: net.ipv6.conf.default.disable_ipv6, value: '1' }
  - { key: net.core.somaxconn, value: '4096' }
  - { key: net.ipv4.conf.all.rp_filter, value: '0' }
  - { key: net.ipv4.conf.default.rp_filter, value: '0' }
  - { key: net.bridge.bridge-nf-call-iptables, value: '1' }
  - { key: net.bridge.bridge-nf-call-ip6tables, value: '1' }
  - { key: net.netfilter.nf_conntrack_max, value: '1000000' }

# ============================================
# Variables for role 20_disable_swap
# ============================================

# Disable swap (fstab, swapoff; LVM swap volumes and GRUB are auto-discovered when present)
# Default: true (required for Kubernetes nodes)
disable_swap: true

# ============================================
# Variables for role 21_grow_disk_to_full
# ============================================

# Grow system disk LVM to 100% after hypervisor/TF disk resize (Oracle cloud-init ~32G root)
# Adds partition + vgextend; root LV is extended by role 22 when this or extend_swap_to_root is true
# Default: false in role; enable when disk was resized before init
grow_disk_to_full: true

# ============================================
# Variables for role 22_extend_swap_to_root
# ============================================

# Extend root filesystem with all free LVM space in root VG
# (swap reclaim and/or space added by grow_disk_to_full; VG/LV auto-discovered)
# Default: true
extend_swap_to_root: true

# ============================================
# Variables for role 23_init_data_disk
# ============================================

# Prepare non-system data disks (see role 23_init_data_disk defaults)
# Default: false in rolex
# prepare_data_disk_mode: raw | xfs | ext4
prepare_data_disk: false

# Resolve targets from host inventory provision.disks (wwn/serial), not by size scan
# Default: true
prepare_data_disk_use_inventory: true

# Optional: restrict to a single slot (e.g. 1 for second disk). Empty = all disks with wwn
prepare_data_disk_inventory_slot: ""

# Legacy size-based discovery when prepare_data_disk_use_inventory: false
prepare_data_disk_min_size_gib: 50
prepare_data_disk_mode: raw

# For raw mode: remove existing partition table before Rook claims the disk
# Default: true
prepare_data_disk_wipe_existing_partitions: true

# ============================================
# Variables for role 06_configure_kernel
# ============================================

# Configure kernel parameters (GRUB/EFI)
# Default: false (kernel params not configured)
# When true, kernel params are updated and GRUB is rebuilt
configure_kernel_params: false

# Enable pstate configuration for CPU performance
# Default: false (pstate not configured)
# When true, amd_pstate or intel_pstate params added depending on CPU vendor
pstate_performance: false

# AMD pstate value (only if pstate_performance: true and AMD CPU)
# Allowed: "active", "passive", "guided"
# Default: "active"
amd_pstate: "active"

# Intel pstate value (only if pstate_performance: true and Intel CPU)
# Allowed: "active", "passive"
# Default: "active"
intel_pstate: "active"

# Change SMT (Simultaneous Multi-Threading) settings
# Default: false (SMT unchanged)
# When true, nosmt=force is added to kernel parameters
change_smt: false

# SMT value (only if change_smt: true)
# Allowed: "on", "off"
# Default: "off"
smt: "off"

# Disable IPv6
# Default: false (IPv6 not disabled)
# When true, IPv6 disabled in sysctl and ipv6.disable=1 added to kernel
disable_ipv6: true

# Additional kernel parameters
# Format: space-separated string
# Example: "quiet splash"
# Default: undefined
default_kernel_params: ""

# IOMMU kernel parameter
# Format: parameter string
# Example: "iommu=on" or "intel_iommu=on"
# Default: undefined
iommu_param: ""

# ============================================
# Variables for role 15_configure_journald
# ============================================

# Enable journald limits and baseline logrotate
configure_journald: true

# Disable systemd-journald persistent logging (Storage=none, purge old journals)
journald_disabled: false

# Maximum disk space for persistent journal storage
journald_max_disk_use: 2G

# Journal retention by age (empty = disk limit only)
journald_max_age: 30day

# Maximum priority stored in the journal
journald_max_level: info

# Keep this much free space on the journal filesystem
journald_system_keep_free: 1G

# Baseline /var/log logrotate (rotate count + frequency)
journald_logrotate_rotate: 4
journald_logrotate_frequency: weekly

# ============================================
# Variables for role 18_remove_unwanted_services
# ============================================

# Remove cloud-init
# Default: false (cloud-init not removed)
# When true, cloud-init will be removed
remove_cloud_init: true

# Remove snap
# Default: false (snap not removed)
# When true, snap will be removed
# Note: Ubuntu only
remove_snap: true

# Disable systemd-resolved
# Default: false (systemd-resolved not disabled)
# Note: Ubuntu/Debian only
disable_systemd_resolved: true

# Remove unattended-upgrades and disable apt periodic timers
# Default: false (unattended-upgrades not removed)
# Note: Ubuntu/Debian only
remove_unattended_upgrades: true

# Stop, mask, remove auditd; audit=0 in GRUB (Oracle: audit package). Reboot for audit=0.
disable_auditd: true

# ============================================
# Variables for role 08_configure_security
# ============================================

# Disable SELinux
# Default: false (SELinux not disabled)
# Note: Oracle Linux only
disable_selinux: true

# Disable AppArmor
# Default: false (AppArmor not disabled)
# When true, AppArmor service will be stopped and disabled
apparmor_disable: true

# ============================================
# Variables for role 09_configure_locales
# ============================================

# Configure system locales
# Default: false (locales not configured)
# When true, locales configured automatically by OS type
configure_locales: false

# Additional locales to generate (Ubuntu/Debian)
# Format: list of locale strings
# Example: ["en_US.UTF-8 UTF-8", "ru_RU.UTF-8 UTF-8"]
# Default: undefined (no locales added)
# Note: Ubuntu/Debian only
additional_locales: ["en_US.UTF-8 UTF-8", "ru_RU.UTF-8 UTF-8"]

# Default system locale
# Format: locale string
# Example: "en_US.UTF-8", "ru_RU.UTF-8"
# Default: undefined (en_US.UTF-8 used)
# Applied automatically by OS type
default_locale: "en_US.UTF-8"

# ============================================
# Variables for role 10_manage_services
# ============================================

# List of services to manage (enable/disable)
# Format: list of dicts with name and disable
# Example:
#   - { name: "service1", disable: true }
#   - { name: "service2", disable: false }
# Default: undefined (no services managed)
services_to_disable: []

# ============================================
# Variables for role 11_certificates
# ============================================

harbor_host: harbor.example.com
nexus_host: nexus.example.com

# Enable certificate configuration
# Default: false (certificates not configured)
certificates_configure: true

# Org CA root(s) to install into the system trust store.
# string or list; empty string / [] = skip download (certificates_configure still gates the role).
# Filename per URL: <hostname with dots→dashes>.crt
#   https://ca.example.com:8443/roots.pem → ca-example-com.crt
pki_ca_url:
  - "https://ca.example.com:8443/roots.pem"
  - "https://ca.example.com:8443/roots.pem"
# Example list:
# pki_ca_url:
#   - "https://ca.dev.example.com:8443/roots.pem"
#   - "https://ca.example.com:8443/roots.pem"

# Verify TLS when downloading pki_ca_url (false for private step-ca bootstrap).
ca_certificate_validate_certs: false

# Path to directory with custom certificates (relative to playbook_dir)
# Default: undefined (custom certs not installed)
# Example: "files/certs" or "certificates"
# All .crt and .pem files from this directory will be installed
custom_certs_dir: ""

# ============================================
# Variables for role 12_date_timezone
# ============================================

# System timezone
# Format: IANA timezone (e.g. Europe/Moscow, America/New_York, UTC)
# Default: Europe/Moscow
timezone: Europe/Moscow

# Host chrony management (role 12). Set false on infra NTP server leaves so
# init-infra-post does not re-enable chrony after atlas-infra-edge masks it.
ntp_manage_host_chrony: true

# NTP servers for time sync
# Format: list of IPs or hostnames
# Example: ["192.168.1.1", "pool.ntp.org"]
ntp_servers:
  - 192.168.1.53

# Wait after enabling NTP before offset check
ntp_sync_settle_seconds: 10

# Max allowed absolute time offset (seconds) after settle
ntp_sync_max_offset_seconds: 1.0

# ============================================
# Variables for role 13_configure_repo
# ============================================
# Contract: docs/pkg-repos-contract.md  |  Catalog: docs/pkg-repos-catalog.yml
#
# Greenfield hard cut (Phase 2): leaf lists only which repos to enable and the
# exact URI apt/yum must use. Legacy per-repo boolean flags / org filename
# prefixes / client-side nexus|nginx|public resolvers are removed.

# Wipe /etc/apt/sources.list.d or /etc/yum.repos.d before writing pkg_repos
cleanup_repositories: true

# Convenience base for composing Nexus URIs in leaf overlays
pkg_repo_base: https://nexus.example.com/repository

# Base package repos (empty = role writes nothing unless extras fill in).
# Example for Ubuntu guest:
# pkg_repos:
#   - name: ubuntu
#     enabled: true
#     uri: "{{ pkg_repo_base }}/ubuntu"
# Mixed leaves list every OS they may host; wrong-OS rows are skipped on the node.
# Env default may hold OS base; leaf stack adds via pkg_repos_extra (concat in role).
pkg_repo_nginx_domain: "repo.example.com"
pkg_repos:
  - name: ubuntu
    enabled: true
    uri: "{{ 'ubuntu' | pkg_repo_nginx_uri(pkg_repo_nginx_domain) }}"
  - name: debian-main
    enabled: true
    uri: "{{ 'debian-main' | pkg_repo_nginx_uri(pkg_repo_nginx_domain) }}"
  - name: debian-security
    enabled: true
    uri: "{{ 'debian-security' | pkg_repo_nginx_uri(pkg_repo_nginx_domain) }}"
  - name: OL9_baseos
    enabled: true
    uri: "{{ 'OL9_baseos' | pkg_repo_nginx_uri(pkg_repo_nginx_domain) }}"
  - name: OL9_appstream
    enabled: true
    uri: "{{ 'OL9_appstream' | pkg_repo_nginx_uri(pkg_repo_nginx_domain) }}"
  - name: OL9_developer_EPEL
    enabled: true
    uri: "{{ 'OL9_developer_EPEL' | pkg_repo_nginx_uri(pkg_repo_nginx_domain) }}"
  - name: OL9_codeready_builder
    enabled: true
    uri: "{{ 'OL9_codeready_builder' | pkg_repo_nginx_uri(pkg_repo_nginx_domain) }}"
  - name: OL10_baseos
    enabled: true
    uri: "{{ 'OL10_baseos' | pkg_repo_nginx_uri(pkg_repo_nginx_domain) }}"
  - name: OL10_appstream
    enabled: true
    uri: "{{ 'OL10_appstream' | pkg_repo_nginx_uri(pkg_repo_nginx_domain) }}"
  - name: OL10_developer_EPEL
    enabled: true
    uri: "{{ 'OL10_developer_EPEL' | pkg_repo_nginx_uri(pkg_repo_nginx_domain) }}"

# =============================================================================
# Package repos extras (concat onto env default pkg_repos in 13_configure_repo)
# =============================================================================
pkg_repos_extra:
  - name: debian-containerd
    enabled: true
    uri: "{{ 'debian-containerd' | pkg_repo_nginx_uri(pkg_repo_nginx_domain) }}"
  - name: ubuntu-containerd
    enabled: true
    uri: "{{ 'ubuntu-containerd' | pkg_repo_nginx_uri(pkg_repo_nginx_domain) }}"
  - name: k8s-ubuntu-1.36
    enabled: true
    uri: "{{ 'k8s-ubuntu-1.36' | pkg_repo_nginx_uri(pkg_repo_nginx_domain) }}"
  - name: k8s-1.36
    enabled: true
    uri: "{{ 'k8s-1.36' | pkg_repo_nginx_uri(pkg_repo_nginx_domain) }}"
  - name: yum_docker-ce-stable-9
    enabled: true
    uri: "{{ 'yum_docker-ce-stable-9' | pkg_repo_nginx_uri(pkg_repo_nginx_domain) }}"
  - name: yum_docker-ce-stable-10
    enabled: true
    uri: "{{ 'yum_docker-ce-stable-10' | pkg_repo_nginx_uri(pkg_repo_nginx_domain) }}"
  - name: OL9_UEKR7
    enabled: true
    uri: "{{ 'OL9_UEKR7' | pkg_repo_nginx_uri(pkg_repo_nginx_domain) }}"
  - name: OL9_UEKR8
    enabled: true
    uri: "{{ 'OL9_UEKR8' | pkg_repo_nginx_uri(pkg_repo_nginx_domain) }}"
  - name: OL10_UEKR8
    enabled: true
    uri: "{{ 'OL10_UEKR8' | pkg_repo_nginx_uri(pkg_repo_nginx_domain) }}"


# APT Acquire::By-Hash (typical when uri points at nginx pkg-repo mirrors)
pkg_repo_apt_acquire_by_hash: true

# PostgreSQL major version for pgdg-yum path under uri
pgsql_version: "18"

# ============================================
# Variables for role 14_install_software
# ============================================

# Additional packages to install
# Format: space-separated string or list
# Example: "jq nano vim" or ["jq", "nano", "vim"]
# Default: undefined (only base packages installed)
install_packages: "qemu-guest-agent"

# Packages to remove
# Format: space-separated string or list
# Example: "package1 package2" or ["package1", "package2"]
# Default: undefined (no packages removed)
uninstall_packages: ""

# NOTE: System update is in role 99_update_reboot
# Use variable update_now in section 99_update_reboot

# ============================================
# Variables for role 16_configure_bash
# ============================================

# Configure Bash (prompt, history)
# Default: false (Bash not configured)
configure_bash: true

# Export LANG/LC_ALL from /etc/profile — off while configure_locales is false
bash_export_locale: false

# Custom Bash prompt
# Format: string with escape sequences
# Example: "\\[\\033[01;32m\\]\\u@\\h\\[\\033[00m\\]:\\[\\033[01;34m\\]\\w\\[\\033[00m\\]$ "
# Default: undefined
custom_bash_prompt: "\\[\\033[01;33m\\]\\u@\\h\\[\\033[00m\\]:\\[\\033[01;32m\\]\\w\\[\\033[00m\\] \\[\\033[01;34m\\][\\#]\\\
  [\\033[01;31m\\]\\$\\[\\033[00m\\] "
# Bash history size
# Format: number
# Example: 10000
# Default: undefined
bash_history_size: 10000

# ============================================
# Variables for role 17_configure_network
# ============================================
# Backend: systemd-networkd (all OS). Empty network_interfaces = auto-discover from host.
#
# Play batching for NM → networkd handoff (playbooks/init_nodes.yaml play 3):
#   "100%" — full parallel (default; wall ≈ slowest host)
#   1      — one host at a time (safest when SSH may flap during handoff)
#   2 / 25% — fixed or percentage batches
node_foundation_network_serial: "100%"

# Unified interface list for Ubuntu, Debian, and Oracle Linux.
# Empty [] = auto-discover. Populated = declarative override for systemd-networkd.
# Example:
#   - name: eth0
#     address: 192.168.1.100/24
#     gateway: 192.168.1.1
#     dns: []
network_interfaces: []

# Default DNS for resolv.conf and .network when item.dns is empty
dns_servers: ["192.168.1.53"]

# Fallback default gateway when runtime discovery returns empty (typical lab /24)
network_default_gateway: "192.168.1.1"

# Handoff poll retries after switching to systemd-networkd (delay 2s between checks)
networkd_handoff_attempts: 45

# Public Oracle developer EPEL bootstrap before systemd-networkd (removed later in role 13)
oracle_bootstrap_epel_enabled: true
oracle_bootstrap_epel_repo_file: /etc/yum.repos.d/atlas-bootstrap-OL-developer-EPEL.repo

# ============================================
# Variables for role 99_update_reboot
# ============================================

# Run system update immediately
# Default: false (system not updated immediately)
# When true, full package update is performed
update_now: false

# Enable automatic system update via cron
# Default: false (auto-update not configured)
system_update_scheduler: false

# Time for automatic update
# Format: "HH:MM" (24-hour)
# Example: "03:00"
# Default: undefined
update_schedule_time: "03:00"

# Reboot system after configuration
# Default: false (system not rebooted)
reboot_system: true
dns_domain_suffix: example.com
cluster_domain: "k8s.{{ dns_domain_suffix }}"

node_foundation_init_hosts: "k8s_lbs:k8s_masters:k8s_workers"

###############################################################################
# Cluster leaf: dev/k8s — atlas-node-foundation overlay
# -----------------------------------------------------------------------------
# Purpose : OS bootstrap for k8s_* (init)
# Defaults: sibling atlas-node-foundation group_vars/all/atlas-node-foundation.yml (+ roles/*/defaults)
# Docs    : docs/stacks/k8s-core.md
#           Infra OS bootstrap lives on dev/infra (docs/stacks/infra-edge.md).
#           Must cover the same inventory groups as atlas-k8s-core limits.
#
# Prefer atlas-node-foundation.secrets.yml (or Vault) for passwords.
###############################################################################

# =============================================================================
# Targeting
# =============================================================================

# Leaf DNS identity
# (duplicated into every atlas-*.yml that uses leaf DNS / workspace id)
dns_domain_suffix: dev-mxhash.com # Public DNS suffix for this cluster
cluster_domain: "k8s.{{ dns_domain_suffix }}" # Cluster FQDN, usually a name under the DNS suffix

node_foundation_init_hosts: "k8s_lbs:k8s_masters:k8s_workers"

# =============================================================================
# Package repos extras (concat onto env default pkg_repos in 13_configure_repo)
# =============================================================================
pkg_repos_extra:
  - name: debian-containerd
    enabled: true
    uri: "{{ 'debian-containerd' | pkg_repo_nginx_uri(pkg_repo_nginx_domain) }}"
  - name: ubuntu-containerd
    enabled: true
    uri: "{{ 'ubuntu-containerd' | pkg_repo_nginx_uri(pkg_repo_nginx_domain) }}"
  - name: k8s-ubuntu-1.36
    enabled: true
    uri: "{{ 'k8s-ubuntu-1.36' | pkg_repo_nginx_uri(pkg_repo_nginx_domain) }}"
  - name: k8s-1.36
    enabled: true
    uri: "{{ 'k8s-1.36' | pkg_repo_nginx_uri(pkg_repo_nginx_domain) }}"
  - name: yum_docker-ce-stable-9
    enabled: true
    uri: "{{ 'yum_docker-ce-stable-9' | pkg_repo_nginx_uri(pkg_repo_nginx_domain) }}"
  - name: yum_docker-ce-stable-10
    enabled: true
    uri: "{{ 'yum_docker-ce-stable-10' | pkg_repo_nginx_uri(pkg_repo_nginx_domain) }}"
  - name: OL9_UEKR7
    enabled: true
    uri: "{{ 'OL9_UEKR7' | pkg_repo_nginx_uri(pkg_repo_nginx_domain) }}"
  - name: OL9_UEKR8
    enabled: true
    uri: "{{ 'OL9_UEKR8' | pkg_repo_nginx_uri(pkg_repo_nginx_domain) }}"
  - name: OL10_UEKR8
    enabled: true
    uri: "{{ 'OL10_UEKR8' | pkg_repo_nginx_uri(pkg_repo_nginx_domain) }}"


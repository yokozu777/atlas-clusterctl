---
# Proxmox hypervisor — FQDN, SSH и inventory из atlas-compute-provision.yml (provision_pve_*)
ansible_host: "{{ provision_pve_host }}"
ansible_user: "{{ provision_pve_user }}"
ansible_ssh_user: "{{ provision_pve_user }}"
ansible_ssh_pass: "{{ provision_pve_ssh_password }}"
ansible_python_interpreter: "{{ provision_pve_python_interpreter }}"
ansible_ssh_private_key_file: ""
ansible_ssh_common_args: "-o PreferredAuthentications=password -o PubkeyAuthentication=no -o IdentitiesOnly=yes -o IdentityFile=/dev/null"

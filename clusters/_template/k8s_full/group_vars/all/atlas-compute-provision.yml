###############################################################################
# Cluster leaf: dev/k8s — atlas-compute-provision overlay
# -----------------------------------------------------------------------------
# Purpose : Proxmox VM / DNS / TF state knobs for this leaf
# Defaults: sibling playbooks/group_vars/all/provision_defaults.yml
# Docs    : docs/stacks/compute-provision.md
#
# Prefer atlas-compute-provision.secrets.yml (or Vault) for tokens/passwords.
###############################################################################

# =============================================================================
# Stack
# =============================================================================
# TF layout under stacks/<name>/ — k8s leaf (lbs/masters/workers).

# Leaf DNS identity
# (duplicated into every atlas-*.yml that uses leaf DNS / workspace id)
dns_domain_suffix: dev-mxhash.com # Public DNS suffix for this cluster
cluster_domain: "k8s.{{ dns_domain_suffix }}" # Cluster FQDN, usually a name under the DNS suffix
dns_server_ip: 192.168.1.219 # Address of the lab DNS server

provision_stack: k8s
# Lifecycle: apply | recreate | destroy
provision_mode: recreate

# =============================================================================
# Inventory → Terraform maps
# =============================================================================
provision_hosts_file: "{{ cluster_inventory | default(cluster_config_dir ~ '/hosts', true) }}"
provision_inventory_group_map_k8s:
  k8s_lbs: lbs_node
  k8s_masters: masters_node
  k8s_workers: workers_node
provision_tf_module_map_k8s:
  lbs_node: proxmox_lbs_node
  masters_node: proxmox_masters_node
  workers_node: proxmox_workers_node

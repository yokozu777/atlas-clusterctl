# atlas-infra-edge — secrets overlay (ci/infra)
# Prefer Ansible Vault for commits shared beyond the lab host.
# Merge order: catalog atlas-*.yml first, then this file.
# Orchestration contract: docs/stacks/infra-edge.md

# bind_* TSIG keys optional when zones use Jinja → provision_dns_key_secret / external_dns_*.

bind_apex_tsig_secret: ''
bind_k8s_tsig_secret: ''
bind_istio_tsig_secret: ''
external_dns_tsig_secret: '' # TSIG key for the Kubernetes DNS zone
external_dns_istio_tsig_secret: '' # TSIG key for the Istio DNS zone
stepca_init_password: '' # Password used to initialize step-ca
nginx_cache_sync_ssh_password: '' # SSH password for nginx cache sync
infra_cache_seed_publish_registry_user: '' # Registry user that publishes the cache seed
infra_cache_seed_publish_registry_password: '' # Registry password that publishes the cache seed
infra_cache_seed_load_registry_user: '' # Registry user for pulling the cache seed
infra_cache_seed_load_registry_password: '' # Registry password for pulling the cache seed

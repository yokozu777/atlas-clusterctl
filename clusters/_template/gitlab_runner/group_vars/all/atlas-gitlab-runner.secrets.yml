# atlas-gitlab-runner — secrets overlay (ci/gitlab)
# Prefer Ansible Vault for commits shared beyond the lab host.
# Merge order: catalog atlas-*.yml first, then this file.
# Orchestration contract: docs/stacks/gitlab-runner.md
#
# Auto-create is enabled on this leaf (gitlab_runner_token_auto_create=true):
#   Set gitlab_runner_api_private_token to a PAT/project token with
#   create_runner + read_api (+ manage_runner for reset recovery).
#   Runner auth token may stay CHANGEME — role 03 resolves per-host glrt-…
#   into managed config.toml (secrets and/or config.toml on the host; not workspace).
# Manual override: put a real glrt-… in gitlab_runner_authentication_token instead.
# Migration: remove the old shared GitLab runner description
#   atlas:gitlab-runner.example.com after cutover to per-host runners.

# Modern GitLab runner authentication token (glrt-…); optional when auto_create=true.
gitlab_runner_authentication_token: ''

# GitLab API token for idempotent runner create/lookup (required when auto_create=true).
gitlab_runner_api_private_token: ''

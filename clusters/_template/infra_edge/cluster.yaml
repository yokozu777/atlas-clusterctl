# Public scaffold ``_template/infra_edge`` (exported from ``dev/infra``).
# Regenerate: python3 -m clusterctl.tools.export_template --from dev/infra --template infra_edge --flatten-cascade
# Init: ./cluster init <env>/<name> --template infra_edge
#
# Scrub live hostnames / secrets before committing the public template.

# Reference deployable infra-edge lab.
# Phases: provision → init-infra → infra → init-infra-post (golden templates: lab/pve-templates)
# Copy scaffold: ./cluster init <id> --template infra_edge
# Orchestration contract: docs/stacks/infra-edge.md
# Does not replace / delete infra inside dev/k8s; this leaf owns the shared infra VM.
# infra compose cold path (Phase 3–6): compose_render → compose_pull → compose_start_core
#   → 11_sync_infra_cache_pull,14_infra_cache_seed_load → compose_start_registry → compose_reconcile → 11_sync_infra_cache_push
# Phase 6: docker baseline is one comma-union invocation (bootstrap+engine+daemon).

schema_version: 2
id: ''
display_name: null
playbooks:
  atlas-compute-provision:
    source: local
    layout: roles/
    shallow: true
    sync: never
    url: git@github.com:yokozu777/atlas-compute-provision.git
    ref: main
    entries:
      templates:
        file: playbooks/build_templates.yaml
        invocations:
        - tags: 00_ensure_workspace
        - tags: 00_check_pve_templates,01_prepare_system
        - tags: 02_download_images
        - tags: 03_customize_images
        - tags: 04_upload_images
        - tags: 05_create_pve_templates
        ansible:
          strategy: linear
          forks: 100
      provision:
        file: playbooks/provision_nodes.yaml
        invocations:
        - tags: 00_ensure_workspace
        - tags: 00_validate_provision
        - tags: 06_configure_git
        - tags: 07_tf_state_pull
        - tags: 08_generate_tf_vars
        - tags: 09a_tf_destroy_dns
        - tags: 09_hypervisor_cleaner
        - tags: 10_tf_apply
        - tags: provision_wait_ssh
          root_ssh: true
        - tags: 11_tf_state_push
        git_ssh: true
        ansible:
          strategy: linear
          forks: 100
    path: atlas-compute-provision
    path_relative_to: sibling
  atlas-node-foundation:
    source: local
    layout: roles/
    shallow: true
    sync: never
    url: git@github.com:yokozu777/atlas-node-foundation.git
    ref: main
    entries:
      # Short OS bootstrap before BIND/CA exist (no DNS rewrite / apt / CA download).
      init-infra:
        file: playbooks/init_nodes.yaml
        invocations:
        - tags: 00_ensure_workspace
        - tags: 00_gather_facts,00_init,01_backup_etc,02_init_sshd,03_configure_users,04_configure_hostname
          limit: infra_platform
          root_ssh: true
        - tags: 06_configure_kernel,08_configure_security,09_configure_locales,10_manage_services
          limit: infra_platform
          root_ssh: true
        - tags: 14_install_software,15_configure_journald,16_configure_bash
          limit: infra_platform
          root_ssh: true
        - tags: 19_configure_sysctl_limits,20_disable_swap,21_grow_disk_to_full,22_extend_swap_to_root
          limit: infra_platform
          root_ssh: true
        git_ssh: true
        when:
          inventory_groups_any:
          - infra_platform
          vars:

      # After atlas-infra-edge/infra: DNS→BIND, apt, trust CA, repos, timezone, reboot.
      init-infra-post:
        file: playbooks/init_nodes.yaml
        invocations:
        - tags: 00_ensure_workspace
        - tags: 00_gather_facts,17_configure_network
          limit: infra_platform
          root_ssh: true
        - tags: 18_remove_unwanted_services
          limit: infra_platform
          root_ssh: true
        - tags: 11_certificates
          limit: infra_platform
          root_ssh: true
        - tags: 13_configure_repo
          limit: infra_platform
          root_ssh: true
        - tags: 12_date_timezone
          limit: infra_platform
          root_ssh: true
        - tags: 99_update_reboot
          limit: infra_platform
          root_ssh: true
        git_ssh: true
        when:
          inventory_groups_any:
          - infra_platform
          vars:

    path: atlas-node-foundation
    path_relative_to: sibling
  atlas-infra-edge:
    source: local
    layout: roles/
    shallow: true
    sync: never
    url: git@github.com:yokozu777/atlas-infra-edge.git
    ref: main
    entries:
      infra:
        file: playbooks/infra_hosts.yaml
        invocations:
        - tags: 00_ensure_workspace
        - tags: 01_validate_vars
        # Phase 6: one ansible-playbook invocation for docker baseline (bootstrap gated in-role).
        - tags: 00_bootstrap_infra_repos,01_install_docker_engine,02_configure_docker_daemon
          limit: infra_platform
        - tags: compose_render
          limit: infra_platform
        - tags: compose_pull
          limit: infra_platform
        - tags: compose_start_core
          limit: infra_platform
        - tags: 11_sync_infra_cache_pull,14_infra_cache_seed_load
          limit: infra_platform
        - tags: compose_start_registry
          limit: infra_platform
        - tags: compose_reconcile
          limit: infra_platform
        - tags: 11_sync_infra_cache_push
          limit: infra_platform
        ansible:
          strategy: linear
          forks: 100
        when:
          inventory_groups_any:
          - infra_platform
    path: atlas-infra-edge
    path_relative_to: sibling
phases:
- provision: atlas-compute-provision/provision
- init-infra: atlas-node-foundation/init-infra
- infra: atlas-infra-edge/infra
- init-infra-post: atlas-node-foundation/init-infra-post
execution:
  mode: docker
  image: yokozu/krang
  tag: latest
cluster_id_aliases: {}
inventory: hosts

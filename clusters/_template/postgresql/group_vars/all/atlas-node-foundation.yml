###############################################################################
# Cluster leaf: dev/postgresql — atlas-node-foundation overlay
# -----------------------------------------------------------------------------
# Purpose : OS bootstrap for pgsql_* (init)
# Defaults: sibling atlas-node-foundation group_vars/all/atlas-node-foundation.yml (+ roles/*/defaults)
# Docs    : docs/stacks/postgresql.md
#           Must cover the same inventory groups as atlas-postgresql limits.
#
# Prefer atlas-node-foundation.secrets.yml (or Vault) for passwords.
###############################################################################

# =============================================================================
# Targeting
# =============================================================================

# Leaf DNS identity
# (duplicated into every atlas-*.yml that uses leaf DNS / workspace id)
dns_domain_suffix: example.com
cluster_domain: "pgsql.{{ dns_domain_suffix }}" # Cluster FQDN, usually a name under the DNS suffix

node_foundation_init_hosts: "pgsql_etcd_cluster:pgsql_cluster:pgsql_lbs"

# =============================================================================
# Package repos extras (concat onto env default pkg_repos in 13_configure_repo)
# =============================================================================
pkg_repos_extra:
  - name: pgdg-apt
    enabled: true
    uri: "{{ 'pgdg-apt' | pkg_repo_nginx_uri(pkg_repo_nginx_domain) }}"
  - name: pgdg-yum
    enabled: true
    uri: "{{ 'pgdg-yum' | pkg_repo_nginx_uri(pkg_repo_nginx_domain) }}"

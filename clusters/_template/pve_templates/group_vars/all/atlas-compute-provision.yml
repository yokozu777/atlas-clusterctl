###############################################################################
# Cluster leaf: lab/pve-templates — atlas-compute-provision overlay
# -----------------------------------------------------------------------------
# Purpose : Build golden PVE cloud-init templates only (phase templates).
# Contract: README.md in this leaf (Phase 0 catalog + VMID range).
# Defaults: sibling playbooks/group_vars/all/provision_defaults.yml
#
# No provision_stack / TF inventory maps — this leaf does not create guest VMs.
# Prefer atlas-compute-provision.secrets.yml (or Vault) for PVE SSH.
###############################################################################

# Leaf DNS / workspace identity (build_workdir under workspace/<id>/)
# Orchestration contract: docs/stacks/compute-provision.md
dns_domain_suffix: example.com
cluster_domain: "pve-templates.{{ dns_domain_suffix }}" # Cluster FQDN, usually a name under the DNS suffix

# =============================================================================
# Proxmox — SSH (image download/upload / qm template)
# =============================================================================
# Same lab hypervisor as ci/* stacks (not lab/pgsql's alternate .20).

provision_pve_upload_dir: /tmp/



# Guest cloud-init knobs still referenced by build roles (storage/bridge for qm).




# =============================================================================
# Golden catalog (SoT) — keys = future hosts.provision.clone on stack leaves
# VMID range 400100–400199 reserved (see README.md).
# =============================================================================
provision_pve_templates:
  ubuntu-base:
    id: 400100
    image_url: https://cloud-images.ubuntu.com/minimal/releases/resolute/release/ubuntu-26.04-minimal-cloudimg-amd64.img
    image_url_backup: https://mirror.yandex.ru/ubuntu-cloud-images/minimal/releases/resolute/release/ubuntu-26.04-minimal-cloudimg-amd64.img
  oracle-base:
    id: 400101
    image_url: https://yum.oracle.com/templates/OracleLinux/OL9/u8/x86_64/OL9U8_x86_64-kvm-b293.qcow2
  debian-base:
    id: 400102
    image_url: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-generic-amd64.qcow2
    image_url_backup: https://cdimage.debian.org/images/cloud/trixie/latest/debian-13-generic-amd64.qcow2

build_cloud_image_customize_enabled: false
build_cloud_image_packages:
  - qemu-guest-agent

# TF state knobs unused on this leaf (no provision phase); keep push off.


[defaults]
# Unified cluster ansible config (phase 2+).
# Per-phase roles_path / strategy / forks: clusterctl (see ./cluster config show)
#   → ANSIBLE_ROLES_PATH, ANSIBLE_STRATEGY, ANSIBLE_FORKS
# strategy_plugins: ANSIBLE_STRATEGY_PLUGINS (clusterctl/bootstrap/mitogen.sh)
executable = /bin/bash
allow_world_readable_tmpfiles = true
stdout_callback = default
private_key_file = ${SSH_KEY}
inventory = hosts
host_key_checking = false
gather_facts = False
gathering = smart
fact_caching = jsonfile
# ANSIBLE_CACHE_PLUGIN_CONNECTION is required — clusterctl sets workspace/<id>/.ansible_facts_cache
fact_caching_timeout = 86400
interpreter_python = auto
interpreter_discovery = auto_silent
callbacks_enabled = timer, profile_tasks, profile_roles
[ssh_connection]
pipelining = True
ssh_args = -C -o ControlMaster=auto -o ControlPersist=30m -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null

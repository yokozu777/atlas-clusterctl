provision_gateway: 192.168.1.1
provision_pve_host: 192.168.1.20
provision_pve_user: root
provision_pve_inventory_name: pve
provision_pve_inventory_group: proxmox
provision_proxmox_api_url: https://{{ provision_pve_host }}:8006/api2/json
provision_proxmox_target_node: pve
provision_proxmox_parallel: 40
provision_tf_parallelism: 3
dns_server_ip: 192.168.1.53
provision_dns_server: '{{ dns_server_ip | default(provision_gateway) }}'
provision_dns_zone: '{{ dns_domain_suffix }}.'
provision_dns_key_name: '{{ dns_domain_suffix }}.'
provision_dns_key_algorithm: hmac-sha256
provision_dns_transport: tcp4
provision_dns_tf_manage_a_records: true
provision_vm_full_clone: false
provision_vm_cloudinit_storage: local-zfs
provision_vm_disk_cache: unsafe
provision_vm_disk_format: raw
provision_vm_network_bridge: vmbr0
provision_vm_ciuser: root
provision_ssh_public_key_file: '{{ cluster_pub_keys_dir }}/localuser.pub'
provision_tf_state_local_dir: '{{ atlas_inventory_root }}'
provision_tf_state_git_discard_local: true
gitea_host: example.com
provision_tf_state_repo: git@{{ gitea_host }}:org/atlas-inventory.git
provision_tf_state_branch: main
provision_tf_state_git_push: true
git_user_name: atlas-runner
git_user_email: atlas-runner@example.com
dns_domain_suffix: example.com
cluster_domain: kafka.{{ dns_domain_suffix }}
provision_stack: kafka
provision_mode: recreate
provision_hosts_file: '{{ cluster_inventory | default(cluster_config_dir ~ ''/hosts'',
  true) }}'
provision_inventory_group_map_kafka:
  kafka_controllers: kafka_controller_node
  kafka_brokers: kafka_broker_node
provision_tf_module_map_kafka:
  kafka_controller_node: proxmox_kafka_controller
  kafka_broker_node: proxmox_kafka_broker

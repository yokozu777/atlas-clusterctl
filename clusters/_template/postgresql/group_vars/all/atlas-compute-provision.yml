###############################################################################
# Cluster leaf: ci/postgresql — atlas-compute-provision overlay
# -----------------------------------------------------------------------------
# Purpose : Proxmox VM / DNS / TF state knobs for this leaf
# Defaults: sibling playbooks/group_vars/all/provision_defaults.yml
# Docs    : docs/stacks/compute-provision.md
#
# Prefer atlas-compute-provision.secrets.yml (or Vault) for tokens/passwords.
###############################################################################

# =============================================================================
# Stack
# =============================================================================
# TF layout under stacks/<name>/ — postgresql leaf (etcd/cluster/lbs).

# Leaf DNS identity
# (duplicated into every atlas-*.yml that uses leaf DNS / workspace id)
dns_domain_suffix: example.com
cluster_domain: "pgsql.{{ dns_domain_suffix }}" # Cluster FQDN, usually a name under the DNS suffix

provision_stack: postgresql
# Lifecycle: apply | recreate | destroy
provision_mode: recreate

# =============================================================================
# Inventory → Terraform maps
# =============================================================================
provision_hosts_file: "{{ cluster_inventory | default(cluster_config_dir ~ '/hosts', true) }}"
provision_inventory_group_map_postgresql:
  pgsql_etcd_cluster: pgsql_etcd_node
  pgsql_cluster: pgsql_cluster_node
  pgsql_lbs: pgsql_lbs_node
provision_tf_module_map_postgresql:
  pgsql_etcd_node: proxmox_pgsql_etcd
  pgsql_cluster_node: proxmox_pgsql_cluster
  pgsql_lbs_node: proxmox_pgsql_lbs

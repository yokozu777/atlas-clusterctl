# atlas-compute-provision — secrets overlay (lab/pve-templates)
# Prefer Ansible Vault for commits shared beyond the lab host.
# Merge order: atlas-compute-provision.yml then this file.
# Templates build needs PVE SSH; API token / DNS / cipassword unused here but
# kept for parity with other compute leaves (and future tooling).

provision_pve_ssh_password: '' # SSH password for the Proxmox node
provision_proxmox_token_id: '' # Proxmox API token id, user@realm!name
provision_proxmox_token_secret: '' # Secret for the Proxmox API token
provision_dns_key_secret: '' # TSIG secret for RFC2136 DNS updates
provision_vm_cipassword: '' # Password cloud-init sets on the guest


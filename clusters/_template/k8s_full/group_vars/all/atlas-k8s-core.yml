###############################################################################
# Cluster leaf: dev/k8s — atlas-k8s-core overlay
# -----------------------------------------------------------------------------
# Purpose : control-plane LB, node packages, kubeadm topology, containerd mirrors
# Defaults: sibling atlas-k8s-core group_vars/all/atlas-k8s-core.yml (+ roles/*/defaults)
# Docs    : docs/stacks/k8s-core.md
#           (infra platform SoT: ci/infra — docs/stacks/infra-edge.md)
#
# Prefer atlas-k8s-core.secrets.yml (or Vault) for vip_auth_pass / DNS TSIG.
###############################################################################

# =============================================================================
# Time sync (03_sync_time)
# =============================================================================
# Skew = Ref time (UTC) from chronyc tracking minus local clock (not "System time").
# =============================================================================
# If |skew| > sync_time_hard_step_threshold_seconds → timedatectl set-time, then chronyc makestep.
# =============================================================================

# Leaf DNS identity
# (duplicated into every atlas-*.yml that uses leaf DNS / workspace id)
dns_domain_suffix: example.com # Public DNS suffix for this cluster
cluster_domain: "k8s.{{ dns_domain_suffix }}" # Cluster FQDN, usually a name under the DNS suffix
k8s_cluster_domain: "{{ cluster_domain }}"

sync_time_max_offset_seconds: 1.0
sync_time_settle_seconds: 10
sync_time_hard_step_threshold_seconds: 60
sync_time_probe_timeout_seconds: 30
# NTP for 03_sync_time (infra NTP / BIND host)
ntp_servers: # NTP servers used before package mirrors are reachable
  - "{{ dns_server_ip }}"

# =============================================================================
# Control-plane LB (10_lb) — keepalived + nginx stream
# =============================================================================
# apt "InRelease is not valid yet" on ubuntu.repo.* — LB clock behind Valid-From in
# =============================================================================
# repo metadata. Run 03_sync_time first; NTP from ntp_servers.
# =============================================================================
# VIP apex A: Terraform RFC2136 (09_lb_vip_dns). TSIG = same BIND as provision_dns_*.
vip_address: 192.168.1.210 # Keepalived VIP for the API server
k8s_lb_dns_tf_manage_a_record: true # Create the API A record with Terraform when on
k8s_lb_dns_server: "{{ dns_server_ip }}"
k8s_lb_dns_zone: "{{ dns_domain_suffix }}."
k8s_lb_dns_key_name: "{{ dns_domain_suffix }}."
k8s_lb_dns_key_algorithm: hmac-sha256
k8s_lb_dns_transport: tcp4
k8s_lb_dns_a_ttl: 300

# step-ca root on the infra node. Same list as node-foundation pki_ca_url.
pki_ca_url:
  - "https://ca.{{ dns_domain_suffix }}:8443/roots.pem"

keepalived_router_id: LVS_LB
# "" = auto default IPv4 NIC on each LB (mixed-OS: ens18 vs eth0)
keepalived_interface: "" # NIC for Keepalived; empty uses the default IPv4 interface
keepalived_virtual_router_id: 100
keepalived_master_priority: 200
keepalived_vrrp_instance: VI_1
keepalived_advert_int: 1

nginx_stream_module_path: /usr/lib/nginx/modules/ngx_stream_module.so
lb_packages_debian:
  - libnginx-mod-stream
  - keepalived
lb_packages_oracle:
  - keepalived
  - nginx-mod-stream
  - policycoreutils-python-utils
lb_firewalld_zone: public
lb_firewalld_ports:
  - 22/tcp
  - "{{ k8s_api_port }}/tcp"
lb_services:
  - nginx.service
  - keepalived.service
nginx_worker_connections: 2048
nginx_stream_lb_method: random two least_conn
nginx_proxy_timeout: 300s
nginx_proxy_connect_timeout: 60s
nginx_upstream_max_fails: 3
nginx_upstream_fail_timeout: 30s

# =============================================================================
# Package URI bake (11_k8s_hosts fallback when foundation drop-ins absent)
# =============================================================================
# Prefer nginx mirror host (do not also set pkg_repo_base — base wins over domain).
pkg_repo_base: "" # Package mirror base URL; empty uses the nginx domain
pkg_repo_nginx_ingress_domain: "repo.{{ dns_domain_suffix }}" # Domain of the nginx package mirror
pkg_repo_upstreams: []

# =============================================================================
# Node packages / versions (11_k8s_hosts)
# =============================================================================
k8s_apt_repo_version: "1.36" # Kubernetes apt repository minor version
k8s_version_ubuntu: "1.36.3-1.1" # kubelet, kubeadm, and kubectl pin on Ubuntu
k8s_version_oracle: "1.36.3" # kubelet, kubeadm, and kubectl pin on Oracle Linux
k8s_packages_ubuntu:
  - kubelet={{ k8s_version_ubuntu }}
  - kubeadm={{ k8s_version_ubuntu }}
  - kubectl={{ k8s_version_ubuntu }}
  - containerd.io
  - ipset
  - ipvsadm
k8s_packages_oracle:
  - kubelet-{{ k8s_version_oracle }}
  - kubeadm-{{ k8s_version_oracle }}
  - kubectl-{{ k8s_version_oracle }}
  - containerd.io
  - ipset
  - ipvsadm
  - python3-dnf-plugin-versionlock

# =============================================================================
# containerd registry mirrors (11_k8s_hosts)
# =============================================================================
# Mode only: none, registry, or harbor. Image pulls use registry.<dns suffix>
# on the infra node (192.168.1.219), not the guest hostname infra2.<suffix>.
use_internal_docker_registry: registry
# Upstream for infra pull-through (role 05) when use_internal_docker_registry=registry.
# =============================================================================
# Harbor: mirror_path in Harbor URL; none: hosts.toml mirrors are not created.
# =============================================================================
containerd_registry_mirrors:
  - { dir_name: docker.io, server: "https://registry-1.docker.io", mirror_path: docker-hub }
  - { dir_name: registry-1.docker.io, server: "https://registry-1.docker.io", mirror_path: docker-hub }
  - { dir_name: registry.k8s.io, server: "https://registry.k8s.io", mirror_path: k8s.io }
  - { dir_name: gcr.io, server: "https://gcr.io", mirror_path: gcr.io }
  - { dir_name: mirror.gcr.io, server: "https://mirror.gcr.io", mirror_path: mirror.gcr.io }
  - { dir_name: ghcr.io, server: "https://ghcr.io", mirror_path: ghcr.io }
  # Docker Hub vanity: share docker.io pull-through (hosts.toml slug from mirror_path).
  - { dir_name: cr.fluentbit.io, server: "https://registry-1.docker.io", mirror_path: docker.io }
  - { dir_name: quay.io, server: "https://quay.io", mirror_path: quay.io }
  - { dir_name: docker.elastic.co, server: "https://docker.elastic.co", mirror_path: elastic.co }
  - { dir_name: cr.yandex, server: "https://cr.yandex", mirror_path: cr.yandex }
  - { dir_name: yandex, server: "https://cr.yandex", mirror_path: cr.yandex }
  - { dir_name: public.ecr.aws, server: "https://public.ecr.aws", mirror_path: ecr.aws }
  - { dir_name: ecr-public.aws.com, server: "https://ecr-public.aws.com", mirror_path: ecr-public.aws.com }
  - { dir_name: prom, server: "https://prom", mirror_path: docker-hub }
  - { dir_name: hashicorp, server: "https://hashicorp", mirror_path: docker-hub }
  - { dir_name: jaegertracing, server: "https://jaegertracing", mirror_path: docker-hub }
  - { dir_name: graylog, server: "https://graylog", mirror_path: docker-hub }
  - { dir_name: getsentry, server: "https://getsentry", mirror_path: docker-hub }
  - { dir_name: opensearchproject, server: "https://opensearchproject", mirror_path: docker-hub }
  - { dir_name: redislabs, server: "https://redislabs", mirror_path: docker-hub }
  - { dir_name: rook, server: "https://rook", mirror_path: docker-hub }
  # GHCR vanity: share ghcr.io pull-through (hosts.toml slug from mirror_path).
  - { dir_name: reg.kyverno.io, server: "https://ghcr.io", mirror_path: ghcr.io }
  - { dir_name: "{{ nexus_host }}", server: "https://{{ nexus_host }}", direct: true }

# =============================================================================
# Cluster topology / kubeadm (04_cluster_state + init/join/upgrade)
# =============================================================================
# Co-tagged with lifecycle gates in cluster.yaml; also 00_controller_tooling,
# =============================================================================
# 21_kubeadm_init, 22_cluster_join_token, 23_join_masters, 24_join_workers,
# =============================================================================
# 25_kubeadm_upgrade_control_plane, 26_kubeadm_upgrade_workers.
k8s_cluster_name: kubernetes # kubeadm cluster name
k8s_dns_domain: cluster.local              # kubeadm dnsDomain; in-cluster: *.svc.<k8s_dns_domain>
pod_subnet: 172.16.0.0/16 # Pod CIDR passed to kubeadm
service_subnet: 10.0.0.0/12 # Service CIDR passed to kubeadm
cluster_dns_ip: 10.0.0.10              # kubeadm kube-dns: 10th address of service_subnet
k8s_lb_hostname: kubelb # Short hostname of the API load balancer
control_plane_endpoint: "{{ k8s_lb_hostname }}.{{ dns_domain_suffix }}:{{ k8s_api_port }}"
k8s_api_cert_sans:
  - "{{ vip_address }}"
  - "{{ k8s_lb_hostname }}.{{ dns_domain_suffix }}"
etcd_version: v3.6.12 # etcd release pin

# =============================================================================
# Worker kernel modules (12_workers_kernel_rbd)
# =============================================================================
kernel_modules:
  - overlay
  - br_netfilter
  - ip_vs
  - ip_vs_rr
  - ip_vs_wrr
  - ip_vs_sh
  - nf_conntrack
  - iptable_nat
  - ip_tables
  - xt_addrtype
  - xt_comment

# ---------------------------------------------------------------------------
# Controller / targeting (paths use injected workspace)
# ---------------------------------------------------------------------------
k8s_api_port: 6443 # Kubernetes API port on the load balancer
k8s_ca_cert_filename: mxhash.crt
k8s_ca_cert_path: "{{ k8s_manifests_dir }}/{{ k8s_ca_cert_filename }}"
admin_user: localuser
k8s_admin_user: "{{ admin_user }}"  # compat alias for atlas-k8s-core / addons
k8s_admin_home: "/home/{{ admin_user }}"
k8s_lb_hosts: k8s_lbs # Inventory group of API load balancers
k8s_master_hosts: k8s_masters # Inventory group of control-plane nodes
k8s_worker_hosts: k8s_workers # Inventory group of worker nodes
k8s_node_kubeconfig: "{{ k8s_admin_home }}/.kube/config"
k8s_python_venv: /opt/myenv
k8s_kubeadm_admin_kubeconfig: /etc/kubernetes/admin.conf
k8s_cluster_fact_host: localhost
k8s_copy_kubeconfig_to_admin_home: false
controller_workspace: "{{ cluster_workspace_root }}/controller-state"
controller_manifests_dir: "{{ controller_workspace }}/manifests"
controller_reports_dir: "{{ controller_workspace }}/reports"
controller_kubeconfig: "{{ controller_workspace }}/kubeconfig/admin.conf"
k8s_kubeconfig: "{{ controller_kubeconfig }}"
k8s_manifests_dir: "{{ controller_manifests_dir }}"
controller_python_venv: "{{ controller_workspace }}/venv"
controller_bin_dir: "{{ controller_workspace }}/bin"
controller_helm_config_dir: "{{ controller_workspace }}/helm-config"
controller_ca_cert_dir: "{{ controller_workspace }}/certs"
controller_ca_cert_path: "{{ controller_ca_cert_dir }}/{{ k8s_ca_cert_filename }}"
controller_ssl_cert_file: "{{ controller_ca_cert_dir }}/ca-bundle.crt"
controller_tls_environment: "{{
  {
    'SSL_CERT_FILE': controller_ssl_cert_file,
    'REQUESTS_CA_BUNDLE': controller_ssl_cert_file,
    'GIT_SSL_CAINFO': controller_ssl_cert_file
  } if (pki_ca_url | default('') | length > 0) else {}
}}"
controller_staging_dir: "{{ controller_workspace }}/staging"
controller_secrets_dir: "{{ controller_workspace }}/secrets"
k8s_control_plane_master_host: "{{ groups.get(k8s_master_hosts, []) | first | default('', true) }}"
k8s_control_plane_ssh_user: "{{ admin_user }}"
k8s_control_plane_ssh_target: "{{ k8s_control_plane_ssh_user }}@{{ k8s_control_plane_master_host }}"
k8s_control_plane_ssh_private_key_file: >-
  {{
    lookup('ansible.builtin.env', 'ANSIBLE_PRIVATE_KEY_FILE', default='')
    | default(lookup('ansible.builtin.env', 'SSH_KEY', default=''), true)
    | default(ansible_ssh_private_key_file | default(''), true)
  }}
k8s_control_plane_ssh_extra_args: []
k8s_control_plane_scripts_dir: "{{ controller_workspace }}/scripts"
k8s_kibana_chart_dir: "{{ controller_staging_dir }}/kibana"
keycloak_tf_workspace: "{{ controller_staging_dir }}/keycloak-realm"
k8s_lb_dns_tf_workspace: "{{ controller_staging_dir }}/lb-vip-dns"
# Workspace layout stubs required by atlas-k8s-core 01_validate_vars
# (clusterctl -e does not load product catalog / role 00 defaults).
# Keep provision_tf_state_* aligned with atlas-compute-provision.yml (ADR 001):
# k8s-core sorts after compute-provision in merge order and must not clobber it.
provision_tf_workspace_dir: "{{ cluster_workspace_root }}/tf_workspace"
provision_generated_variables_tf: "{{ cluster_workspace_root }}/generated/variables.tf"
build_workdir: "{{ cluster_workspace_root }}/build/workspace"
build_state_file: "{{ cluster_workspace_root }}/build/build_templates_state.json"
provision_tf_state_local_dir: "{{ atlas_inventory_root }}"
provision_tf_state_repo_prefix: tfstate
provision_tf_state_cluster_path: "{{ provision_tf_state_repo_prefix }}/{{ cluster_id | default(cluster_workspace_id, true) }}"
provision_tf_state_repo_dir: "{{ provision_tf_state_local_dir }}/{{ provision_tf_state_cluster_path }}"

###############################################################################
# Cluster leaf: _template/ceph — atlas-node-foundation overlay
# -----------------------------------------------------------------------------
# Purpose : OS bootstrap for ceph_nodes (init)
# Defaults: sibling atlas-node-foundation group_vars/all/atlas-node-foundation.yml (+ roles/*/defaults)
# Docs    : docs/stacks/ceph.md
#           Must cover the same inventory groups as atlas-ceph limits.
#
# Prefer atlas-node-foundation.secrets.yml (or Vault) for passwords.
###############################################################################

# =============================================================================
# Targeting
# =============================================================================

# Leaf DNS identity
# (duplicated into every atlas-*.yml that uses leaf DNS / workspace id)
dns_domain_suffix: example.com
cluster_domain: "ceph.{{ dns_domain_suffix }}" # Cluster FQDN, usually a name under the DNS suffix

node_foundation_init_hosts: "ceph_nodes"

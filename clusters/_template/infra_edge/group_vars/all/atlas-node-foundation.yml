###############################################################################
# Cluster leaf: dev/infra — atlas-node-foundation overlay
# -----------------------------------------------------------------------------
# Purpose : OS bootstrap for infra_platform (init-infra + init-infra-post)
# Defaults: sibling group_vars/all/atlas-node-foundation.yml (+ roles/*/defaults)
# Docs    : docs/stacks/infra-edge.md
#           (keep limits in sync with infra_platform_hosts / cluster.yaml)
#
# Prefer atlas-node-foundation.secrets.yml (or Vault) for passwords.
###############################################################################

# =============================================================================
# Targeting
# =============================================================================

# Leaf DNS identity
# (duplicated into every atlas-*.yml that uses leaf DNS / workspace id)
dns_domain_suffix: example.com
cluster_domain: "infra.{{ dns_domain_suffix }}" # Cluster FQDN, usually a name under the DNS suffix

node_foundation_init_hosts: infra_platform

# Infra NTP compose (atlas-infra-edge) owns UDP/123 + system clock (CAP_SYS_TIME).
# Do not re-enable host chrony in init-infra-post 12_date_timezone.
ntp_manage_host_chrony: false

# =============================================================================
# Package repos extras (concat onto env default pkg_repos in 13_configure_repo)
# =============================================================================
pkg_repos_extra:
  - name: ubuntu-containerd
    enabled: true
    uri: "{{ 'ubuntu-containerd' | pkg_repo_nginx_uri(pkg_repo_nginx_domain) }}"
  - name: debian-containerd
    enabled: true
    uri: "{{ 'debian-containerd' | pkg_repo_nginx_uri(pkg_repo_nginx_domain) }}"
  - name: yum_docker-ce-stable-9
    enabled: true
    uri: "{{ 'yum_docker-ce-stable-9' | pkg_repo_nginx_uri(pkg_repo_nginx_domain) }}"
  - name: yum_docker-ce-stable-10
    enabled: true
    uri: "{{ 'yum_docker-ce-stable-10' | pkg_repo_nginx_uri(pkg_repo_nginx_domain) }}"

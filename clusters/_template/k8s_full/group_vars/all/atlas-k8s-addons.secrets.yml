# atlas-k8s-addons — secrets overlay (dev/k8s)
# Prefer Ansible Vault for commits shared beyond the lab host.
# Merge order: catalog atlas-*.yml first, then this file.
# Orchestration contract: docs/stacks/k8s-addons.md

# Keep aggregate k8s_secrets: in the catalog (Jinja refs → these keys).

grafana_admin_password: '' # Grafana admin password
keycloak_admin_password: '' # Keycloak admin password
keycloak_oidc_user_password: '' # Password of the Keycloak OIDC user
oauth2_proxy_client_secret: '' # oauth2-proxy OIDC client secret
oauth2_proxy_cookie_secret: '' # oauth2-proxy cookie secret
envoy_gateway_oidc_client_secret: '' # Envoy Gateway OIDC client secret
vault_oidc_client_secret: '' # Vault OIDC client secret
argocd_oidc_client_secret: '' # Argo CD OIDC client secret
pinniped_supervisor_client_secret: '' # Pinniped supervisor OIDC client secret
mailu_secret_key: '' # Mailu secret key
mailu_initial_password: '' # Mailu initial admin password
external_dns_tsig_secret: '' # TSIG key for the Kubernetes DNS zone
external_dns_apex_tsig_secret: '' # TSIG key for the apex DNS zone
external_dns_istio_tsig_secret: '' # TSIG key for the Istio DNS zone
elastic_password: '' # Elasticsearch elastic user password
elastic_cert_password: '' # Elasticsearch certificate password
elastic_logger_password: '' # Elasticsearch logger user password
elastic_admin_password: '' # Elasticsearch admin password
elastic_jaeger_password: '' # Elasticsearch Jaeger user password
kibana_elastic_password: '' # Password Kibana uses for Elasticsearch
kibana_encryption_key: '' # Kibana saved-object encryption key
argocd_admin_password_bcrypt: '' # bcrypt hash of the Argo CD admin password
ceph_dashboard_password: '' # Ceph dashboard admin password
sentry_smtp_password: '' # Sentry SMTP password
sentry_admin_password: '' # Sentry admin password
alertmanager_smtp_password: '' # Alertmanager SMTP password
graylog_root_password: '' # Graylog root password
vault_admin_password: '' # Vault admin password

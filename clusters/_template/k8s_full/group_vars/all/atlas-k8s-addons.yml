# atlas-k8s-addons vars (playbook: cluster_addons.yaml).
# Lab leaf — keep org-specific values here.

# --- 999_debug_tooling ---
# Optional break-glass CLI on cluster nodes (not controller). Hosts: inventory group, g1:g2, or CSV IPs.

# Leaf DNS identity
# (duplicated into every atlas-*.yml that uses leaf DNS / workspace id)
# Orchestration contract: docs/stacks/k8s-addons.md
dns_domain_suffix: example.com
cluster_domain: "k8s.{{ dns_domain_suffix }}"
k8s_cluster_domain: "{{ cluster_domain }}"
dns_server_ip: 192.168.1.53

debug_tooling_install_dir: /usr/local/bin
debug_tooling_staging_dir: /var/tmp/ansible-debug-tooling
debug_tooling_helm_enabled: false
debug_tooling_helm_hosts: k8s_masters
debug_tooling_calicoctl_enabled: true
debug_tooling_calicoctl_hosts: k8s_masters
debug_tooling_istioctl_enabled: true
debug_tooling_istioctl_hosts: k8s_masters
debug_tooling_etcdctl_enabled: true
debug_tooling_etcdctl_hosts: k8s_masters
# Empty = skip kubeconfig install. Example: k8s_masters
debug_tooling_install_kubeconfig: ""
debug_tooling_binary_source: infra
debug_tooling_binary_infra_base: "https://releases.{{ helm_repo_nginx_ingress_domain }}"

# --- 210_helm_bootstrap (atlas-k8s-addons) ---
helm_version: https://get.helm.sh/helm-v4.2.1-linux-amd64.tar.gz
# nginx hostname: <helm_repos.name>.helm.<dns_domain_suffix> (filter helm_repo_client_url)
helm_repo_upstreams:
  - { name: oauth2-proxy, nexus_path: oauth2-proxy, upstream_url: "https://oauth2-proxy.github.io/manifests", upstream_host: oauth2-proxy.github.io }
  - { name: falcosecurity, nexus_path: falco, upstream_url: "https://falcosecurity.github.io/charts", upstream_host: falcosecurity.github.io }
  - { name: projectcalico, nexus_path: calico, upstream_url: "https://docs.tigera.io/calico/charts", upstream_host: docs.tigera.io, chart_hosts: [github.com] }
  - { name: metallb, nexus_path: metallb, upstream_url: "https://metallb.github.io/metallb", upstream_host: metallb.github.io }
  - { name: prometheus-community, nexus_path: prometheus-community, upstream_url: "https://prometheus-community.github.io/helm-charts", upstream_host: prometheus-community.github.io }
  - { name: ceph-csi-operator, nexus_path: rook-ceph-csi-operator, upstream_url: "https://ceph.github.io/ceph-csi-operator", upstream_host: ceph.github.io }
  - { name: rook-release, nexus_path: rook-release, upstream_url: "https://charts.rook.io/release", upstream_host: charts.rook.io }
  - { name: fluent, nexus_path: fluent, upstream_url: "https://fluent.github.io/helm-charts", upstream_host: fluent.github.io }
  - { name: elastic, nexus_path: helm.elastic.local/, upstream_url: "https://helm.elastic.co", upstream_host: helm.elastic.co }
  - { name: hashicorp, nexus_path: helm.releases.hashicorp.com/, upstream_url: "https://helm.releases.hashicorp.com", upstream_host: helm.releases.hashicorp.com }
  - { name: istio, nexus_path: istio/, upstream_url: "https://istio-release.storage.googleapis.com/charts", upstream_host: istio-release.storage.googleapis.com }
  - { name: kiali, nexus_path: kiali/, upstream_url: "https://kiali.org/helm-charts", upstream_host: kiali.org }
  - { name: argo, nexus_path: argo/, upstream_url: "https://argoproj.github.io/argo-helm", upstream_host: argoproj.github.io }
  - { name: codecentric, nexus_path: codecentric/, upstream_url: "https://codecentric.github.io/helm-charts", upstream_host: codecentric.github.io }
  - { name: sentry, nexus_path: sentry/, upstream_url: "https://sentry-kubernetes.github.io/charts", upstream_host: sentry-kubernetes.github.io }
  - { name: jetstack, nexus_path: jetstack/, upstream_url: "https://charts.jetstack.io", upstream_host: charts.jetstack.io }
  - { name: kong-z, nexus_path: kong-z/, upstream_url: "https://charts.konghq.com", upstream_host: charts.konghq.com, chart_hosts: [github.com] }
  - { name: metrics-server, nexus_path: metrics-server/, upstream_url: "https://kubernetes-sigs.github.io/metrics-server", upstream_host: kubernetes-sigs.github.io }
  - { name: aquasecurity, nexus_path: aquasecurity/, upstream_url: "https://aquasecurity.github.io/helm-charts", upstream_host: aquasecurity.github.io }
  - { name: kubecost, nexus_path: kubecost/, upstream_url: "https://kubecost.github.io/cost-analyzer", upstream_host: kubecost.github.io }
  - { name: opencost, nexus_path: opencost/, upstream_url: "https://opencost.github.io/opencost-helm-chart", upstream_host: opencost.github.io }
  - { name: kafka-ui, nexus_path: kafka-ui/, upstream_url: "https://provectus.github.io/kafka-ui-charts", upstream_host: provectus.github.io }
  - { name: chaos-mesh, nexus_path: chaos-mesh/, upstream_url: "https://charts.chaos-mesh.org", upstream_host: charts.chaos-mesh.org }
  - { name: kubevious, nexus_path: kubevious/, upstream_url: "https://helm.kubevious.io", upstream_host: helm.kubevious.io }
  - { name: external-secrets, nexus_path: external-secrets/, upstream_url: "https://external-secrets.io", upstream_host: external-secrets.io, chart_hosts: [github.com] }
  - { name: external-dns, nexus_path: external-dns/, upstream_url: "https://kubernetes-sigs.github.io/external-dns", upstream_host: kubernetes-sigs.github.io }
  - { name: jaegertracing, nexus_path: jaegertracing/, upstream_url: "https://jaegertracing.github.io/helm-charts", upstream_host: jaegertracing.github.io }
  - { name: open-telemetry, nexus_path: open-telemetry/, upstream_url: "https://open-telemetry.github.io/opentelemetry-helm-charts", upstream_host: open-telemetry.github.io }
  - { name: cnpg, nexus_path: cnpg/, upstream_url: "https://cloudnative-pg.io/charts", upstream_host: cloudnative-pg.io, chart_hosts: [github.com] }
  - { name: headlamp, nexus_path: headlamp/, upstream_url: "https://kubernetes-sigs.github.io/headlamp/", upstream_host: kubernetes-sigs.github.io }
  - { name: thanos-community, nexus_path: thanos-community, upstream_url: "https://thanos-community.github.io/helm-charts", upstream_host: thanos-community.github.io }
  - { name: kyverno, nexus_path: kyverno/, upstream_url: "https://kyverno.github.io/kyverno/", upstream_host: kyverno.github.io }
  - { name: policy-reporter, nexus_path: policy-reporter/, upstream_url: "https://kyverno.github.io/policy-reporter", upstream_host: kyverno.github.io }
  - { name: mailu, nexus_path: mailu/, upstream_url: "https://mailu.github.io/helm-charts", upstream_host: mailu.github.io }

helm_repos:
  - { name: oauth2-proxy, path: oauth2-proxy }
  - { name: falcosecurity, path: falco }
  - { name: projectcalico, path: calico }
  - { name: metallb, path: metallb }
  - { name: prometheus-community, path: prometheus-community }
  - { name: ceph-csi-operator, path: rook-ceph-csi-operator }
  - { name: rook-release, path: rook-release }
  - { name: fluent, path: fluent }
  - { name: elastic, path: helm.elastic.local/ }
  - { name: hashicorp, path: helm.releases.hashicorp.com/ }
  - { name: istio, path: istio/ }
  - { name: kiali, path: kiali/ }
  - { name: argo, path: argo/ }
  - { name: codecentric, path: codecentric/ }
  - { name: sentry, path: sentry/ }
  - { name: jetstack, path: jetstack/ }
  - { name: kong-z, path: kong-z/ }
  - { name: metrics-server, path: metrics-server/ }
  - { name: aquasecurity, path: aquasecurity/ }
  - { name: kubecost, path: kubecost/ }
  - { name: opencost, path: opencost/ }
  - { name: kafka-ui, path: kafka-ui/ }
  - { name: chaos-mesh, path: chaos-mesh/ }
  - { name: kubevious, path: kubevious/ }
  - { name: external-secrets, path: external-secrets/ }
  - { name: external-dns, path: external-dns/ }
  - { name: jaegertracing, path: jaegertracing/ }
  - { name: open-telemetry, path: open-telemetry/ }
  - { name: cnpg, path: cnpg/ }
  - { name: headlamp, path: headlamp/ }
  - { name: thanos-community, path: thanos-community }
  - { name: kyverno, path: kyverno/ }
  - { name: policy-reporter, path: policy-reporter/ }
  - { name: mailu, path: mailu/ }
# Helm --create-namespace: tracing, falco, istio-system, vault, chaos-mesh, argo-rollouts, oauth2-proxy, cnpg-system, headlamp, kyverno, policy-reporter, pinniped, mailu, trivy-system, opencost
k8s_platform_namespaces:
  - "{{ monitoring_namespace }}"
  - "{{ logging_namespace }}"
  - "{{ keycloak_namespace }}"
  - "{{ argocd_namespace }}"
  - "{{ cert_manager_namespace }}"

fluentbit_suppress_calico_audit_webhook_noise: true
prometheus_kube_apiserver_scrape_interval: 60s
rook_csi_volumeattributesclass_rbac: true

# --- 220_calico (atlas-k8s-addons) ---
calico_operator_namespace: tigera-operator
calico_system_namespace: calico-system
calico_linux_dataplane: BPF
calico_bgp: Disabled
calico_ip_pool_encapsulation: VXLANCrossSubnet
# CRDs: helm template calico-crds projectcalico/projectcalico.org.v3 --version <calico_chart_version>
calico_chart_version: "v3.32.1"
calico_chart_state: present

# --- 310_prometheus ---
monitoring_namespace: monitoring
prometheus_chart_version: "88.5.3"
prometheus_chart_state: present
grafana: admin
grafana_dashboards_timezone: Europe/Moscow
# alertmanager_smtp_password → atlas-k8s-addons.secrets.yml
alertmanager_mail:
  use_tls: true
  host: "{{ mailu_mx_host }}"
  port: 587
  username: "admin@{{ mailu_domain }}"
  from: "admin@{{ mailu_domain }}"
  to: "{{ keycloak_oidc_user_email }}"
  insecure_skip_verify: true
grafana_dashboard_infra_base: "https://raw.{{ helm_repo_nginx_ingress_domain }}"
grafana_dashboard_source:
  istio: infra
  ceph: infra
  envoy: infra
  thanos: infra
  falco: infra
  cnpg: infra
  keycloak: infra
  argocd: infra
  argo_rollouts: infra
  external_secrets: infra
  jaeger: infra
  calico_typha: infra
  calico: infra
  metallb: infra
  vault: infra
  fluentbit: infra
  cert_manager: infra
  elasticsearch: infra
  blackbox: infra
  consul: infra
  external_dns: infra
  chaos_mesh: infra
  opentelemetry: infra
  trivy: infra
  opencost: infra

# --- 320_blackbox ---
blackbox_exporter_chart_version: "11.17.2"
blackbox_exporter_chart_state: present

# --- 330_prometheus_adapter ---
prometheus_adapter_chart_version: "5.3.0"
prometheus_adapter_chart_state: present

# --- 340_calico_metrics ---

# --- 410_snapshotter ---
get_snapshotter: internal-nginx
snapshotter_version: 8.6.0
snapshotter_github_repo: https://github.com/kubernetes-csi/external-snapshotter.git
snapshotter_repo: ""
external_snapshotter_dir: "{{ k8s_manifests_dir }}/external-snapshotter"
setup_custom_content_nginx: "{{ get_snapshotter == 'internal-nginx' and setup_custom_nginx }}"
snapshotter_effective_repo: >-
  {{ snapshotter_github_repo if get_snapshotter == 'github' else snapshotter_repo }}
snapshotter_kustomize_base_url: >-
  https://{{ custom_nginx_ingress_domain }}/external-snapshotter/v{{ snapshotter_version }}
custom_nginx_content:
  - name: external-snapshotter
    source_repo: "{{ snapshotter_github_repo }}"
    version: "{{ snapshotter_version }}"
    sync_paths:
      - client
      - deploy/kubernetes
    dest_subdir: "external-snapshotter/v{{ snapshotter_version }}"
snapshotter_archive_filename: "external-snapshotter-v{{ snapshotter_version }}.tar.gz"
snapshotter_archive_url: "https://{{ custom_nginx_ingress_domain }}/{{ snapshotter_archive_filename }}"

# --- 420_rook_operator, 430_rook_cluster, 440_rook_csi_drivers ---
rook_operator_namespace: rook-ceph
rook_cluster_namespace: rook-ceph-cluster
rook_operator_chart_version: "v1.20.6"
rook_operator_chart_state: present
rook_cluster_chart_version: "v1.20.6"
rook_cluster_chart_state: present
rook_csi_drivers_chart_version: "1.0.4"
rook_csi_drivers_chart_state: present
# Ceph mon TOO_MANY_PGS threshold (string in CephCluster.spec.cephConfig.global).
# Default 250 trips on 3-OSD labs with RBD+CephFS+RGW (~265 PG/OSD). Raises the
# warn bar only; does not resize pools. Empty = omit (Ceph default 250).
rook_mon_max_pg_per_osd: "500"

# --- 450_thanos ---
# Community chart (GitHub Pages, not Bitnami/OCI). Prometheus remote_write -> Receive; no sidecar.
thanos_chart_version: "0.32.0"
thanos_chart_state: present
thanos_objstore_secret: thanos-objstore
thanos_obc_name: thanos-blocks
thanos_storage_class: ceph-bucket
thanos_pvc_storage_class: ceph-block
thanos_receive_replicas: 1
thanos_query_replicas: 1
thanos_store_replicas: 1
thanos_receive_pvc_size: 10Gi
thanos_store_pvc_size: 8Gi
thanos_compactor_pvc_size: 10Gi
thanos_compactor_retention_raw: 30d
thanos_compactor_retention_5m: 60d
thanos_compactor_retention_1h: 90d
thanos_receive_tsdb_retention: 24h
thanos_prometheus_retention: 24h
thanos_query_http_url: "http://thanos-query.{{ monitoring_namespace }}.svc.{{ k8s_dns_domain }}:9090"
thanos_receive_remote_write_url: "http://thanos-receive.{{ monitoring_namespace }}.svc.{{ k8s_dns_domain }}:10908/api/v1/receive"

# --- 510_metallb ---
metallb_namespace: metallb-system
metallb_chart_version: "0.16.1"
metallb_chart_state: present
metallb_ip_pool: "192.168.1.150-192.168.1.199"

# --- 520_envoy_gateway ---
envoy_gateway_namespace: envoy-gateway-system
envoy_gateway_chart_oci: oci://docker.io/envoyproxy/gateway-helm
envoy_gateway_chart_version: "v1.8.3"
envoy_gateway_chart_state: present
envoy_gateway_release_name: eg
envoy_gateway_gatewayclass_name: eg
envoy_gateway_gateway_name: atlas
envoy_gateway_proxy_name: atlas-proxy
envoy_gateway_wildcard_secret: atlas-wildcard-tls
ingress_lb_ip: 192.168.1.199

# --- 530_external_dns ---
external_dns_namespace: external-dns
external_dns_chart_version: "1.21.1"
external_dns_chart_state: present
# dns_server_ip — ci/infra BIND (group_vars/all/atlas-infra-edge.yml client bridge)
external_dns_txt_owner_id: k8s
external_dns_apex_txt_owner_id: k8s-apex

# --- 540_cert_manager ---
cert_manager_namespace: cert-manager
cert_manager_chart_version: "v1.21.1"
cert_manager_chart_state: present
k8s_certmanager_cluster_manifest: certmanager-cluster.yaml
# ACME directory host for ClusterIssuer (not the same as foundation pki_ca_url).
pki_ca_host: "ca.{{ dns_domain_suffix }}"

# --- 550_trust_manager ---
trust_manager_chart_version: "v0.24.0"
trust_manager_chart_state: present

# --- 560_apply_ingress ---
# (jaeger:16686, falco-falcosidekick-ui:2802, chaos-dashboard:2333).
keycloak_realm: example
falco_host: "falco.{{ k8s_cluster_domain }}"
jaeger_host: "jaeger.{{ k8s_cluster_domain }}"
kiali_host: "kiali.{{ k8s_cluster_domain }}"
headlamp_host: "headlamp.{{ k8s_cluster_domain }}"
policy_reporter_host: "policy-reporter.{{ k8s_cluster_domain }}"
prometheus_host: "prometheus.{{ k8s_cluster_domain }}"
alertmanager_host: "alertmanager.{{ k8s_cluster_domain }}"
grafana_host: "k8s-grafana.{{ k8s_cluster_domain }}"
rook_host: "rook.{{ k8s_cluster_domain }}"
argocd_host: "argo.{{ k8s_cluster_domain }}"
argo_rollouts_host: "rollouts.{{ k8s_cluster_domain }}"
vault_host: "vault.{{ k8s_cluster_domain }}"
chaos_mesh_host: "chaos-mesh.{{ k8s_cluster_domain }}"
opencost_host: "opencost.{{ k8s_cluster_domain }}"
pinniped_host: "pinniped.{{ k8s_cluster_domain }}"
pinniped_login_host: "pinniped-login.{{ k8s_cluster_domain }}"
mailu_host: "mail.{{ k8s_cluster_domain }}"
mailu_mx_host: "smtp.{{ k8s_cluster_domain }}"
blackbox_host: "blackbox.{{ k8s_cluster_domain }}"
keycloak_host: "keycloak.{{ k8s_cluster_domain }}"
keycloak_url: "https://{{ keycloak_host }}"
oidc_issuer_url: "{{ keycloak_url }}/auth/realms/{{ keycloak_realm }}"
# Enable only — issuer is oidc_issuer_url; client_id/ca_file from addons role 940 defaults
kube_apiserver_oidc_enabled: true
oauth2_host: "oauth2.{{ k8s_cluster_domain }}"
oauth2_callback_url: "https://{{ oauth2_host }}/oauth2/callback"
oauth2_signout_url: "https://{{ oauth2_host }}/oauth2/sign_out"
elasticsearch_host: "elasticsearch.{{ k8s_cluster_domain }}"
kibana_host: "kibana.{{ k8s_cluster_domain }}"
k8s_ingress_apps:
  - name: kibana
    chart_state_var: kibana_chart_state
    host: "{{ kibana_host }}"
    namespace: "{{ logging_namespace }}"
    service: kibana-kibana
    port: 5601
    tls: false
    ssl_passthrough: true
    backend_protocol: HTTPS

  - name: elasticsearch-master
    chart_state_var: elasticsearch_chart_state
    host: "{{ elasticsearch_host }}"
    namespace: "{{ logging_namespace }}"
    service: elasticsearch-master
    port: 9200
    tls: false
    ssl_passthrough: true
    backend_protocol: HTTPS

  - name: prometheus-kube-prometheus-prometheus
    chart_state_var: prometheus_chart_state
    host: "{{ prometheus_host }}"
    namespace: "{{ monitoring_namespace }}"
    service: prometheus-kube-prometheus-prometheus
    port: 9090

  - name: prometheus-kube-prometheus-alertmanager
    chart_state_var: prometheus_chart_state
    host: "{{ alertmanager_host }}"
    namespace: "{{ monitoring_namespace }}"
    service: prometheus-kube-prometheus-alertmanager
    port: 9093
    oidc_auth: true

  - name: grafana-ingress
    chart_state_var: prometheus_chart_state
    host: "{{ grafana_host }}"
    namespace: "{{ monitoring_namespace }}"
    service: prometheus-grafana
    port: 80
    profile: grafana
    oidc_auth: true

  - name: rook-ceph-mgr-dashboard
    chart_state_var: rook_cluster_chart_state
    host: "{{ rook_host }}"
    namespace: "{{ rook_cluster_namespace }}"
    service: rook-ceph-mgr-dashboard
    port: 7000
    profile: rook

  - name: keycloak-http
    chart_state_var: keycloak_chart_state
    host: "{{ keycloak_host }}"
    namespace: "{{ keycloak_namespace }}"
    service: keycloak-http
    port: 80

  - name: argocd-server-ingress
    chart_state_var: argocd_chart_state
    host: "{{ argocd_host }}"
    namespace: "{{ argocd_namespace }}"
    service: argocd-server
    port: 80

  - name: argo-rollouts-dashboard
    chart_state_var: argo_rollouts_chart_state
    host: "{{ argo_rollouts_host }}"
    namespace: "{{ argo_rollouts_namespace }}"
    service: argo-rollouts-dashboard
    port: 3100
    oidc_auth: true

  - name: pinniped-supervisor
    chart_state_var: pinniped_chart_state
    host: "{{ pinniped_host }}"
    namespace: "{{ pinniped_namespace }}"
    service: "{{ pinniped_supervisor_service }}"
    port: 443
    ssl_passthrough: true
    backend_protocol: HTTPS

  - name: pinniped-login
    chart_state_var: pinniped_chart_state
    host: "{{ pinniped_login_host }}"
    namespace: "{{ pinniped_namespace }}"
    service: "{{ pinniped_login_service }}"
    port: 80
    oidc_auth: true

  - name: mailu
    chart_state_var: mailu_chart_state
    host: "{{ mailu_host }}"
    namespace: "{{ mailu_namespace }}"
    service: mailu-front
    port: 80
    oidc_auth: true

  - name: blackbox
    chart_state_var: blackbox_exporter_chart_state
    host: "{{ blackbox_host }}"
    namespace: "{{ monitoring_namespace }}"
    service: blackbox-exporter-prometheus-blackbox-exporter
    port: 9115

  - name: oauth2-proxy
    chart_state_var: oauth2_proxy_chart_state
    host: "{{ oauth2_host }}"
    namespace: "{{ oauth2_proxy_namespace }}"
    service: oauth2-proxy
    port: 80

  - name: headlamp
    chart_state_var: headlamp_chart_state
    host: "{{ headlamp_host }}"
    namespace: "{{ headlamp_namespace }}"
    service: headlamp
    port: 80
    oidc_auth: true

  - name: vault
    chart_state_var: vault_chart_state
    host: "{{ vault_host }}"
    namespace: "{{ vault_namespace }}"
    service: vault
    port: 8200

  - name: kiali
    chart_state_var: kiali_chart_state
    host: "{{ kiali_host }}"
    namespace: "{{ istio_namespace }}"
    service: kiali
    port: 20001
    oidc_auth: true

  - name: jaeger
    chart_state_var: jaeger_chart_state
    host: "{{ jaeger_host }}"
    namespace: "{{ tracing_namespace }}"
    service: jaeger
    port: 16686

  - name: falco
    chart_state_var: falco_chart_state
    host: "{{ falco_host }}"
    namespace: "{{ falco_namespace }}"
    service: falco-falcosidekick-ui
    port: 2802

  - name: policy-reporter
    chart_state_var: policy_reporter_chart_state
    host: "{{ policy_reporter_host }}"
    namespace: "{{ policy_reporter_namespace }}"
    service: policy-reporter-ui
    port: 8080
    oidc_auth: true

  - name: chaos-dashboard
    chart_state_var: chaos_mesh_chart_state
    host: "{{ chaos_mesh_host }}"
    namespace: "{{ chaos_mesh_namespace }}"
    service: chaos-dashboard
    port: 2333

  - name: opencost
    chart_state_var: opencost_chart_state
    host: "{{ opencost_host }}"
    namespace: "{{ opencost_namespace }}"
    service: opencost
    port: 9090
    oidc_auth: true

# --- 610_elasticsearch_prepare, 620_elasticsearch ---
elasticsearch_chart_version: "8.5.1"
elasticsearch_chart_state: present
logging_namespace: logging
elastic_es_output_host: elasticsearch-master
elastic_es_output_port: 9200
ESimageTag: "9.4.4"
elastic_superuser: elastic
elastic_logger: logger
elastic_admin: admin
elastic_jaeger: jaeger
elasticsearch_ilm_delete_after: 7d
elasticsearch_logs_index_replicas: 0
elasticsearch_snapshot_backend: rook-rgw
elasticsearch_snapshot_storage_class: ceph-bucket
elasticsearch_snapshot_obc_name: elasticsearch-snapshots
elasticsearch_snapshot_repo_name: atlas-logs
elasticsearch_slm_schedule: "0 30 1 * * ?"
elasticsearch_slm_expire_after: 30d
# elasticsearch_snapshot_s3_access_key / elasticsearch_snapshot_s3_secret_key → atlas-k8s-addons.secrets.yml
elasticsearch_snapshot_s3_endpoint: ""
elasticsearch_snapshot_s3_bucket: ""
elasticsearch_snapshot_s3_protocol: https

# --- 630_kibana_prepare, 640_kibana ---
kibana_chart_version: "8.5.1"
kibana_chart_state: present
KibanaimageTag: "9.4.4"
kibana_chart_artifact: "kibana-{{ kibana_chart_version }}.tgz"

# --- 650_fluentbit ---
fluentbit_chart_version: "0.58.1"
fluentbit_chart_state: present
# Cheap gate before kubernetes/Lua. false + empty exclude list = old full ingest.
fluentbit_early_severity_gate: true
# CRI files never opened (even errors). Ceph/chaos health is Grafana.
fluentbit_kube_tail_exclude_namespaces:
  - rook-ceph
  - rook-ceph-cluster
  - chaos-mesh
# Full log lines (all severities) for these CRI namespaces.
fluentbit_kube_full_namespaces:
  - falco
  - logging
  - kube-system
# Lua: drop info except allowlist ns and heartbeat.
fluentbit_index_info_logs: false
fluentbit_host_syslog_tail: true
fluentbit_host_syslog_paths: "/var/log/messages,/var/log/syslog"
# Poison ES bulk must not retry forever (False = unlimited). Trace_Error logs HTTP body.
fluentbit_es_retry_limit: 5
fluentbit_es_trace_error: true

# --- 710_istio ---
istio_namespace: istio-system
istio_chart_version: "1.30.3"
istio_chart_state: present
istio_version: 1.30.3
# Istio container images (pulled via harbor docker-hub proxy when hub is docker.io/istio)
istio_image_hub: docker.io/istio
istio_image_tag: "1.30.3"   # set to '' for :latest; omit to fall back to istio_version
# Mesh-wide Telemetry in istio_namespace: provider otel-tracing. Lab default 100; lower in prod.
istio_tracing_sampling_percentage: 100

# --- 720_external_dns_istio ---
external_dns_istio_chart_version: "1.21.1"
external_dns_istio_chart_state: present
istio_ingress_lb_ip: 192.168.1.198


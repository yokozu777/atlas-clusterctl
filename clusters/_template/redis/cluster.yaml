# Public scaffold ``_template/redis`` (exported from ``dev/redis``).
# Regenerate: python3 -m clusterctl.tools.export_template --from dev/redis --template redis
# Init: ./cluster init <env>/<name> --template redis
#
# Scrub live hostnames / secrets before committing the public template.

# Reference deployable Redis Cluster HA — provision → init → redis (golden templates: lab/pve-templates).
# Copy scaffold: ./cluster init <id> --template redis
# Does not touch dev/k8s or k8s stacks.

schema_version: 2
id: ''
display_name: null
playbooks:
  atlas-compute-provision:
    # Git remotes for Jenkins repos sync (parity with ci/jenkins / ci/kafka).
    source: git
    layout: roles/
    shallow: true
    sync: always
    url: https://github.com/yokozu777/atlas-compute-provision.git
    ref: main
    entries:
      templates:
        file: playbooks/build_templates.yaml
        invocations:
        - tags: 00_ensure_workspace
        - tags: 00_check_pve_templates,01_prepare_system
        - tags: 02_download_images
        - tags: 03_customize_images
        - tags: 04_upload_images
        - tags: 05_create_pve_templates
        ansible:
          strategy: linear
          forks: 100
      provision:
        file: playbooks/provision_nodes.yaml
        invocations:
        - tags: 00_ensure_workspace
        - tags: 00_validate_provision
        - tags: 06_configure_git
        - tags: 07_tf_state_pull
        - tags: 08_generate_tf_vars
        - tags: 09a_tf_destroy_dns
        - tags: 09_hypervisor_cleaner
        - tags: 10_tf_apply
        - tags: provision_wait_ssh
          root_ssh: true
        - tags: 11_tf_state_push
        git_ssh: true
        ansible:
          strategy: linear
          forks: 100
    path: atlas-compute-provision
    path_relative_to: sibling
  atlas-node-foundation:
    source: git
    layout: roles/
    shallow: true
    sync: always
    url: https://github.com/yokozu777/atlas-node-foundation.git
    ref: main
    entries:
      init:
        file: playbooks/init_nodes.yaml
        invocations:
        - tags: 00_ensure_workspace
        - tags: 00_gather_facts,00_init,01_backup_etc,02_init_sshd,03_configure_users,04_configure_hostname
          limit: redis_cluster_masters:redis_cluster_replicas:redis_proxies:redis_lbs
          root_ssh: true
        - tags: 11_certificates
          limit: redis_cluster_masters:redis_cluster_replicas:redis_proxies:redis_lbs
          root_ssh: true
        - tags: 13_configure_repo
          limit: redis_cluster_masters:redis_cluster_replicas:redis_proxies:redis_lbs
          root_ssh: true
        - tags: 06_configure_kernel,08_configure_security,09_configure_locales,10_manage_services
          limit: redis_cluster_masters:redis_cluster_replicas:redis_proxies:redis_lbs
          root_ssh: true
        - tags: 14_install_software,15_configure_journald,16_configure_bash
          limit: redis_cluster_masters:redis_cluster_replicas:redis_proxies:redis_lbs
          root_ssh: true
        - tags: 19_configure_sysctl_limits,20_disable_swap,21_grow_disk_to_full,22_extend_swap_to_root
          limit: redis_cluster_masters:redis_cluster_replicas:redis_proxies:redis_lbs
          root_ssh: true
        - tags: 17_configure_network
          limit: redis_cluster_masters:redis_cluster_replicas:redis_proxies:redis_lbs
          root_ssh: true
        - tags: 18_remove_unwanted_services
          limit: redis_cluster_masters:redis_cluster_replicas:redis_proxies:redis_lbs
          root_ssh: true
        - tags: 12_date_timezone
          limit: redis_cluster_masters:redis_cluster_replicas:redis_proxies:redis_lbs
          root_ssh: true
        - tags: 99_update_reboot
          limit: redis_cluster_masters:redis_cluster_replicas:redis_proxies:redis_lbs
          root_ssh: true
        git_ssh: true
        when:
          inventory_groups_any:
          - redis_cluster_masters
          - redis_cluster_replicas
          - redis_proxies
          - redis_lbs
    path: atlas-node-foundation
    path_relative_to: sibling
  atlas-redis:
    source: git
    layout: roles/
    shallow: true
    sync: always
    url: https://github.com/yokozu777/atlas-redis.git
    ref: main
    entries:
      cluster:
        file: playbooks/redis_cluster.yaml
        invocations:
        - tags: 00_ensure_workspace
        - tags: 01_validate_vars
        - tags: 200_redis_node
          limit: redis_cluster_masters:redis_cluster_replicas
        - tags: 201_redis_cluster
          limit: redis_cluster_masters:redis_cluster_replicas
        - tags: 202_redis_proxy
          limit: redis_proxies
        - tags: 203_redis_lb
          limit: redis_lbs
        - tags: 204_redis_verify
          limit: redis_cluster_masters:redis_cluster_replicas
        git_ssh: true
        when:
          inventory_groups_any:
          - redis_cluster_masters
          - redis_cluster_replicas
          - redis_proxies
          - redis_lbs
    path: atlas-redis
    path_relative_to: sibling
phases:
- provision: atlas-compute-provision/provision
- init: atlas-node-foundation/init
- redis: atlas-redis/cluster
execution:
  mode: docker
  image: yokozu/krang
  tag: latest
cluster_id_aliases: {}
inventory: hosts

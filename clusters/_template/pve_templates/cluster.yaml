# Public scaffold ``_template/pve_templates`` (exported from ``dev/pve-templates``).
# Regenerate: python3 -m clusterctl.tools.export_template --from dev/pve-templates --template pve_templates
# Init: ./cluster init <env>/<name> --template pve_templates
#
# Scrub live hostnames / secrets before committing the public template.

# Golden PVE cloud templates — build only (no guest VM provision).
# Contract: clusters/lab/pve-templates/README.md (Phase 0–1).
# Orchestration: docs/stacks/compute-provision.md (templates phase).

schema_version: 2
id: ''
display_name: null
playbooks:
  atlas-compute-provision:
    source: git
    layout: roles/
    shallow: true
    sync: always
    url: https://github.com/yokozu777/atlas-compute-provision.git
    ref: main
    entries:
      templates:
        file: playbooks/build_templates.yaml
        invocations:
          - tags: 00_ensure_workspace
          - tags: 00_check_pve_templates,01_prepare_system
          - tags: 02_download_images
          - tags: 03_customize_images
          - tags: 04_upload_images
          - tags: 05_create_pve_templates
        ansible:
          strategy: linear
          forks: 100
    path: atlas-compute-provision
    path_relative_to: sibling
phases:
  - templates: atlas-compute-provision/templates
execution:
  mode: docker
  image: yokozu/krang
  tag: latest
inventory: hosts
cluster_id_aliases: {}
